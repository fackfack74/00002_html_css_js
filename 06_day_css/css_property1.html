<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete" />
    <style>
        .search{
            width: 800px;
            height: 100px;
            overflow: auto;
        }
        .search .description{
            float: left;
            margin: 10px;
            font-size: 20px;
        }
        .search .select{
            float: left;
            margin: 10px;
        }
        .search .select .list{
            margin: 0;
            width: 140px;
            border-top-style: none;
            border-left-style: none;
            border-right-style: none;

            border-bottom-width: 3px;
            border-bottom-color: black;
            border-bottom-style: solid;
            font-size: 15px;
        }
        .search .search_service{
            float: left;
            margin: 10px;
            width: 230px;
            /*
            border-top-style: solid;
            border-left-style: solid;
            border-right-style: solid;
            border-bottom-style: solid;
            */
            border-style: solid;
            border-radius: 10px;
            border-color: blue;
            border-width: 2px;
            padding-left: 10px;
        }
        .login{
            width: 250px;
            height: 50px;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login #login_btn{
            background-color: rgb(9, 170, 92);
            color: white;
            border: 1px solid white;
            border-radius: 10px;
            font-weight: 600;
        }
        .login #passkey_btn{
            color: rgb(9, 170, 92);
            border: 1px solid rgb(9, 170, 92);
            font-weight: 600;
            border-radius: 10px;
        }
        .circle1{
            width: 100px;
            height: 100px;
            background-color: rgb(9, 170, 92);
            border-radius: 50px;
        }
        .circle2{
            width: 100px;
            height: 100px;
            border-width: 1px;
            border-style: solid;
            border-color: rgb(9, 170, 92);
            border-radius: 50px;
        }
        .on_off{
            width: 330px;
            height: 150px;
            border-width: 5px;
            border-style: solid;
            border-color: red;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .space{
            width: 10px;
            /*
            border-width: 1px;
            border-style: solid;
            border-color: black;
            */
        }
        
        
        
        
        .on_off .off{
            width: 100px;
            height: 50px;
            background-color: gray;
            border-top-left-radius: 50px;
            border-top-right-radius: 50px;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
        }
        .on_off .off .circle_off{
            width: 40px;
            height: 40px;
            background-color: white;
            border-radius: 50%;
            
            margin-top: 5px;
            margin-left: 5px;
        }
        .on_off .off .off_txt{
            width: 100px;
            height: 50px;
            font-size: 25px;
            color: white;

            text-align: right; 
            justify-content : center; 
            transform: translate(-8%,  10%); 
            margin-top: -45px;
        }
        .on_off .on{
            width: 100px;
            height: 50px;
            background-color: rgb(9, 170, 92);
            border-top-left-radius: 50px;
            border-top-right-radius: 50px;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
        }
        .on_off .on .on_txt{
            width: 100px;
            height: 50px;
            font-size: 25px;
            color: white;

            justify-content : center; 
            transform: translate(8%,  10%); 
            margin-bottom: -50px;
        }
        .on_off .on .on_txt:hover{
            cursor: pointer;
        }
        
        .on_off .on .circle_on{
            width: 40px;
            height: 40px;
            background-color: white;
            border-radius: 50%;
            
            margin-top: 5px;
            margin-left: 55px;
        }
        .song1{
            font-size: 16px;
            font-weight: 600;
            line-height: 500%;
            font-family:Arial, Helvetica, sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }

        @font-face {
            font-family: 'CookieRun-Regular';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/CookieRun-Regular.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="search">
        <div class="description">
            자주찾는 검색
        </div>
        <div class="select">
            <select class="list">
                <option value="1" selected>1 주민등록등본</option>
                <option value="2">2 주민등록초본</option>
            </select>
        </div>
        <div class="search_service">
            <input style="border-style: none; transform: translate(0, -30%); margin-right: 10px;" type="text" id="in_service" name="in_service" placeholder="찾으시는 서비스를 입력하세요." />
            <img src="../img/login.svg" style="transform:translate(20%, 10%)"/>
        </div>
    </div>
    <div class="login">
        <div class="login" id="login_btn">
            로그인
        </div>
        <div class="login" id="passkey_btn">
            패스키 로그인
        </div>
    </div>
    <div class="circle1">

    </div>
    <div class="circle2">

    </div>
    <div class="triangle1">

    </div>
    <div class="on_off">
        <div class="space"></div>
        <div class="off">
            <div class="circle_off"></div>
            <div class="off_txt">OFF</div>
        </div>
        <div class="space"></div>
        <div class="on">
            <div class="on_txt">ON</div>
            <div class="circle_on"></div>
        </div>
        <div class="space"></div>
    </div>
    <div class="song1" style="background-color:orange; background-image: url('../img/refresh.svg'); background-repeat: repeat;">
        동해물과 백두산이 마르고 닳도록
    </div>
    <div class="song2">
        <!-- '눈누'를 검색하여 웹폰트로 사용을 복사하여 css에 추가.
         복사한 font-family를 복사하여 해당 글자항목의 font-family에 적용-->
        <p style="font-family: 'CookieRun-Regular'; text-decoration: line-through; text-indent: 20px;">하느님이 보우하사 우리나라 만세</p>
        <!-- google fonts로 검색하여 icon 항목에서 이미지 파일을 직접 받거나, 
         url을 link하여 css로 적용할 수 있다. -->
        <span class="material-symbols-outlined">delete</span>
        <img src="../img/checked_box.svg"/>
        <img src="../img/refresh.svg"/>
    </div>
</body>
</html>
