<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Local에 다운로드 
     (https://blog.jquery.com/2020/05/04/jquery-3-5-1-released-fixing-a-regression/)
     에서 Download https://code.jquery.com/jquery-3.5.1.js 선택
     Ctrl+A 선택(전체선택) 후 메모장에 붙여넣어 jquery-3.5.1.js로 저장
     -->
    
    <script src="./jquery-3.5.1.js"></script>
</head>
<body>
    <div id="myDiv">
        <p>안녕하세요!</p>
        <p>jQuery를 배우고 있습니다.</p>
    </div>
    <button id="myButton">텍스트 변경</button>

    <script>
        $(document).ready(function(){
            $("#myButton").on("click", function(e){
                let targetElement = $("#myDiv");
                let paragraphs = targetElement.find("p");

                paragraphs.each(function(){
                    let currentText = $(this).text();
                    let newText = currentText + "(Modified)";
                    $(this).text(newText);
                });
            })
        });
    </script>
</body>
</html>
