<!DOCTYPE html>
<html>
<!-- 주석처리 -->
    <head>
        <meta charset="utf-8"><!-- 글자 인코딩 설정 -->
    </head>
    <body>
        <h1>토끼와 거북이</h1><!-- 주제 제목 -->
        <p>옛날 옛적에 토끼와 거북이가 살았습니다.</p><!-- 주제 내용 -->
        <h1>
            <p>테스트</p>
        </h1>
        <!-- img태그의 src속성은 이미지 파일 위치 값, alt는 이미지파일 위치에 실제 이미지가 없으면 출력될 텍스트 -->
        <img src="./my_photo.png" alt="내 프로필 사진">
        <section class="fruits">
            <h1>과일 목록</h1>
            <ul>
                <li>사과</li>
                <li>딸기</li>
                <li>바나나</li>
                <li>오렌지</li>
            </ul>
        </section>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>요소</th>
                        <th>설명</th>
                        <th>표시 특성</th>
                        <th>참조</th>
                    </tr>
                </thead>
                <tr>
                    <td>
                        <code>&lt;ol&gt;</code>
                    </td>
                    <td>정렬된 목록을 지정.(Ordered List)<br/>
                        자식으로 <code>&lt;li&gt;</code> 만 포함 가능.<br/>
                        항목 순서는 중요도를 의미할 수 있음.<br/>
                        <code>start</code>: 항목에 매겨지는 번호의 시작 값<br/>
                        <code>type</code>: 항목에 매겨지는 번호의 유형
                    </td>
                    <td>
                        <code>block</code>
                    </td>
                    <td>
                        <a href="https://developer.mozilla.org/ko/docs/Web/HTML/Element/ol"  target="_blank">MDN                 
                        </a>
                    </td>
                </tr>
            </table>
        </div>
    </body>
</html>
