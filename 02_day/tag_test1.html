<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../001.ico" />
    <title>Tag 테스트</title>
</head>
<body>
    <!-- h태그 (제목) -->
    <h1>1일 때 h1 46 display : block;</h1>
    <h2>2일 때 h2 35 display : block;</h2>
    <h3>3일 때 h3 27 display : block;</h3>
    <h4>4일 때 h4 24 display : block;</h4>
    <h5>5일 때 h5 19 display : block;</h5>
    <h6>6일 때 h6 15 display : block;</h6>
    <h7>7일 때 h7 24 display : inline;</h7>

    <!-- p태그 (문단) -->
     <p>p 테그는 문단을 나타낼 때 사용하는 Tag</p>
     <hr color="blue" size="10">
     <p color="blue">hr은 수평선 Tag이며 닫기가 없음.</p>
     <blockquote cite="https://wikidocs.net/book/7596">
        웹 개발 입문자를 위한 교재 사이트
     </blockquote>


</body>
</html>
