<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        class Animal{
            //  생성 메소드
            constructor(name){
                this.name = name;
            }
            speak(){
                console.log(`${this.name} 이/가 소리를 냅니다.`);
            }
        }
        const animal1 = new Animal('cat');
        const animal2 = new Animal('dog');
        animal1.speak();
        animal2.speak();

        class Dog extends Animal{
            constructor(name){
                super(name); // super는 class Animal을 뜻함.
            }
        }
        const dog = new Dog('멍멍');
        dog.speak();

        class Cat extends Animal{
            constructor(name){
                super(name);
            }
        }
        const cat = new Cat('나비');
        cat.speak();

        class Person{
            //  생성함수
            constructor(name, age){
                this.name = name;
                this.age = age;
            }

            introduce(){
                console.log(`${this.name}는 나이가 ${this.age} 입니다.`);
            }
        }

        const person1 = new Person('홍길동', 30);
        person1.introduce();

    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
</html>
