<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- inline -->
    <br><br>
    <hr>
    <span style="background-color: gray;">Hello</span>
    <span style="background-color: yellow;">World</span>
    <br>
    <hr>
    <span style="width:200px; margin: 20px; background-color: red;">Hello</span>
    <span style="height:200px; padding: 20px; background-color: green;">World</span>
    <br>
    <hr>
    <!-- block -->
    <div style="background-color: blue;">Hello</div>
    <div style="background-color: red;">World</div>
</body>
</html>
