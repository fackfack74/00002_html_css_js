        function increaseAndPrint(n){
            //  resolve는 다음 실행할 함수
            //  reject는 오류 시 실행할 함수
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    const increased = n + 1;
                    if(increased === 5){
                        reject(new Error("Over num:" + increased));
                        return;
                    }
                    console.log(increased);
                    if(resolve)
                        resolve(increased);
                }, 1000);
            });
        }

        increaseAndPrint(0).then(n => {
            console.log("end:", n);
        });

        increaseAndPrint(0)
        .then(n => {
            return increaseAndPrint(n);
        })
        .then(n => {
            return increaseAndPrint(n);
        })
        .then(n => {
            return increaseAndPrint(n);
        })
        .then(n => {
            return increaseAndPrint(n);
        })
        .catch(e => {
            console.log("err:", e);
        });
