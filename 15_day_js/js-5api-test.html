<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .product-card{
            display: flex;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 250px;
            box-sizing: border-box;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <h1>Our Products(총
        <b id="product_tot_cnt"></b>
    )건</h1>
    <div class="container" id="product-cards-container"></div>
    <script>
        async function getProductList(){
            try{
                const response = await fetch('https://dummyjson.com/products');
                if(response && response.ok){
                    const productListData = await response.json();
                    console.log(productListData.products.length);
                    console.debug("productListData:", productListData);
                    
                    const productCardsContainer
                    = document.getElementById("product-cards-container");

                    const totalCnt = document.getElementById("product_tot_cnt");
                    totalCnt.textContent = productListData.products.length;

                    productListData.products.forEach(product => {
                        const { 
                            title, 
                            price, 
                            brand, 
                            thumbnail, 
                            category
                        } = product;

                        const card = document.createElement('div');
                        card.classList.add('product-card');

                        card.innerHTML = `
                        <img src="${thumbnail}" alt="${title}" />
                        <h3>${title}</h3>
                        <
                        `;

                        productCardsContainer.appendChild(card);
                    });
                }
                
            }catch(e){
                console.error("Error fecting products:", e);
            }
        }
        getProductList();
    </script>
</body>
</html>
