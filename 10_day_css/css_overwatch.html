            /* background-repeat: no-repeat; */
            /* background-position: top center; */

        }
        .container{
            /* width: 1000px;

            max-width: 1000px;
            /* 위의 width, height 선언없이 max-width만 선언하면
            화면 사이즈가 커지거나 줄었을때 하부 div가 자동으로 늘어나거나

            background-size: cover;
            background-repeat: no-repeat;

            position: relative;

            display: flex;
            flex-wrap: wrap;    

            justify-content: center;
            /* align-items: center; */
            align-content: flex-start;
        }
        .container .top_space{
            width: 1000px;
            height: 100px;
        }
        .container .item{
            width: 100px;
            height: 100px;
            margin: 5px;

            border: 5px solid red;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;

            display: inline-flex;

            transform: skew(-10deg);
            overflow: hidden;
        }
        .container .item:hover{
            width: 112px;
            height: 112px;
            margin: 3px;
        }

        .logo{
            position: absolute;
            bottom: 30px;

            /* display: flex;
            justify-content: center; */

            width: 100vw;
            height: 100px;
            margin: 0 auto;

            border: 1px dashed red;
            background-image: url("./overwatch-hero/images/logo_overwatch.png");
            background-size: 15%;
            background-repeat: no-repeat;
            background-position: top center;
        }
    </style>
