<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 200px;
            background-color: royalblue;
            margin: 10px 4px;
            
            display: flex;
            flex-wrap: wrap;/* 자식(.item)의 크기를 유지하고, viewport가 작아지면 하나씩 이동 */
                            /* 선언을 하지않으면 자식(.item)의 크기가 줄어듬. */
        }
        .container .item{
            width: 50px;
            height: 50px;
            border: 3px dashed red;
            background-color: orange;
        }
    </style>
</head>
<body>
    <div class="container">
