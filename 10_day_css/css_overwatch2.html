            background-size: cover;
            background-repeat: no-repeat;

        .container{
            padding-top: 5vh;

            border: 1px dashed black;

        .container .heroes{
            max-width: 1000px;
            height: 75vh;
            margin: 0 auto;
            border: 1px dashed red;

            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            align-content: flex-start;
        }
        .container .heroes .hero{
            width: 100px;
            height: 100px;
            margin: 5px;
            border-radius: 10px;
            transform: skewX(-10deg);
            overflow: hidden;
            box-sizing: border-box;

            border: 3px solid orange;
            background-color: lightgray;

            transition: 
            transform .1s, 
            background-color .6s;
        }
        .container .heroes .hero:hover{
            transform: scale(1.5) skewX(-10deg);
            /* width, height 로 크기를 조절하면 좌측 상단을 기준으로 조절됨.
            transform: scale의 경우 가운데를 기준으로 조절됨. */
            z-index: 1;
        }
        .container .heroes .hero .img{
            width: 100%;
            height: 100%;
            background-position: center;
            background-size: 90px;
            background-repeat: no-repeat;
            transform: translateX(-16px) skewX(14deg);
        }
