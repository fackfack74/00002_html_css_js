<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset style="width: 400px;">
        <legend>회원가입 양식</legend>
        <form method="post" action="form_test1.html">
            <table>
                <tr>
                    <td colspan="2">
                        <label for="id">* 아이디</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input style="width: 150px;" type="text" id="id" name="id">
                    </td>
                    <td>
                        <input type="button" value="아이디 중복 확인">
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <label for="pw">* 비밀번호</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input style="width: 150px;" type="password" id="pw" name="pw">
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <label for="pw2">* 비밀번호 재확인</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input style="width: 150px;" type="password" id="pw2" name="pw2">
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <label for="name">* 이름</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input style="width: 150px;" type="text" id="name" name="name">
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <label for="social_no1">* 주민등록번호</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input style="width: 70px;" type="number" maxlength="6" id="social_no1" name="social_no1">
                        <label for="social_no2">-</label>
                        <input style="width: 70px;" type="number" maxlength="7" id="social_no2" name="social_no2">
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <label for="sex">* 성별</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="radio" name="sex" id="none" checked>선택안함
                        <input type="radio" name="sex" id="female" >여성
                        <input type="radio" name="sex" id="male" >남성
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <label for="birthday">* 생년월일</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input style="width: 150px;" type="date" id="birthday" name="birthday">
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <label for="address">주소</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input style="width: 150px;" type="text" id="address" name="address">
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <label for="address_no">우편번호</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input style="width: 70px;" type="number" id="address_no" name="address_no">
                        <input type="button" value="우편번호 찾기">
                    </td>
                    <td>
                        <input type="checkbox" id="post_sel" name="post_sel" checked>우편 수신 동의
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <label for="email_address">이메일</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input style="width: 150px;" type="text" id="email_address" name="email_address">
                    </td>
                    <td>
                        <input type="checkbox" id="email_sel" name="email_sel" checked>이메일 수신 동의
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <label for="mobile_no1">휴대폰 번호</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <select id="mobile_no1" name="mobile_no1">
                            <option value="010" selected>010</option>
                            <option value="02">02</option>
                            <option value="031">031</option>
                        </select>
                        <label for="mobile_no2">-</label>
                        <input style="width: 40px;" type="number" maxlength="4" id="mobile_no2" name="mobile_no2">
                        <label for="mobile_no3">-</label>
                        <input style="width: 40px;" type="number" maxlength="7" id="mobile_no3" name="mobile_no3">
                    </td>
                    <td>
                        <input type="checkbox" id="mobile_sel" name="mobile_sel" checked>문자 수신 동의
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="button" value="초기화"  onclick="location.reload();">
                    </td>
                    <td>
                        <!--
                        <input type="submit" value="가입하기">
                        -->
                        <input type="button" value="가입하기"  onclick="location.href='./form_test1.html'">
                    </td>
                </tr>
            </table>
        </form>
    </fieldset>
</body>
</html>
