<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Local에 다운로드 
     (https://blog.jquery.com/2020/05/04/jquery-3-5-1-released-fixing-a-regression/)
     에서 Download https://code.jquery.com/jquery-3.5.1.js 선택
     Ctrl+A 선택(전체선택) 후 메모장에 붙여넣어 jquery-3.5.1.js로 저장
     -->
    
    <script src="./jquery-3.5.1.js"></script>
    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .product-card {
            display: flex;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 250px;
            box-sizing: border-box;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <button id="myButton">Click</button>
    <div id="result"></div>

    <h1 id="top_msg" style="display: none;">Our Products(총 <span id="total"></span>건)</h1>
    <div class="container" id="product-cards-container">
        
    </div>

    <script>
    
        $(document).ready(function(){

            function getProductList(responseText){
                let productListData = JSON.parse(responseText);  // 일반적인 텍스트 -> {}객체로 변환.
                // 참고: JSON.stringify() // {}객체 -> 일반적인 텍스트
                // 참고: JSON.parse()  //  일반적인 텍스트 -> {}객체 
                document.querySelector("#top_msg").style.display = "block";
                document.querySelector('#total').textContent
//                document.getElementById('total').textContent 
                = productListData.products.length;

                const productCardsContainer 
                = document.querySelector('#product-cards-container');
//                = document.getElementById('product-cards-container');
                productListData.products.forEach(product => {
                // 비구조화 할당을 이용해서 필요한 데이터만 가져오기
                const { 
                    title, 
                    price, 
                    brand, 
                    thumbnail, 
                    category,
                    total,
                } = product;

                // 웹페이지 출력하기 위한 태그 생성
                const card = document.createElement('div');
                card.classList.add('product-card');

                card.innerHTML = `
                    <img src="${thumbnail}" alt="${title}" />
                    <h3>${title}</h3>
                    <p>Brand: ${brand}</p>
                `;
                productCardsContainer.appendChild(card);
                });
            }
            $("#myButton").on("click", function(){
                $.ajax({
                    url: "https://dummyjson.com/products",
                    method: "GET",
                    dataType: "json",
                    success: function(response){
//                        $("#result").text("<\n" + JSON.stringify(response));
                        getProductList(JSON.stringify(response));
                    },
                    error: function(error){
                        $("#result").text("<" + "failed");
                    },
                });
            });
        });
    </script>
</body>
</html>
