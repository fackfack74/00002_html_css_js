<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Local에 다운로드 
     (https://blog.jquery.com/2020/05/04/jquery-3-5-1-released-fixing-a-regression/)
     에서 Download https://code.jquery.com/jquery-3.5.1.js 선택
     Ctrl+A 선택(전체선택) 후 메모장에 붙여넣어 jquery-3.5.1.js로 저장
     -->
    
    <script src="./jquery-3.5.1.js"></script>
</head>
<body>
    <button class="myButton">Button1</button>
    <button class="myButton">Button2</button>
    <button class="myButton">Button3</button>
    <p id="result"></p>
    <script>
        $(document).ready(function(){
            $(".myButton").on("click", function(e){
                let clickBtn = $(this).text();
                let index = $(this).index();
                $("#result").html(clickBtn + ", " + index);
            })
        })
    </script>
</body>
</html>
