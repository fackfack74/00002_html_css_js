            width: 100px;

        }

        .pw2{

        .name .name_input input:nth-child(1){
            width: 478px;

        }

            width: 500px;

            margin-top: 20px;

        }
        .birth .birth_desc{

        }

            width: 500px;
            height: 40px;

            margin-top: 20px;

            margin-left: auto;
            margin-right: auto;

            color: white;
            background-color: darkgreen;

            display: flex;
            justify-content: center;
            align-items: center;

            border-top-left-radius: 10px;

<body>
    <div>
        <div class="naver_logo"></div>
        <div class="id">
            <div class="id_desc">아이디</div>
            <div class="id_input">
                <input type="text" id="id">
                <input type="text" id="email" placeholder="@naver.com">
            </div>
        </div>
        <div class="pw1">
            <div class="pw1_desc">비밀번호</div>
            <div class="pw1_input">
                <input type="password" id="pw1">
                <div class="pw1_input_img">
                    <img src="../img/lock.svg">
                </div>
            </div>
        </div>
        <div class="pw2">
            <div class="pw2_desc">비밀번호 재확인</div>
            <div class="pw2_input">
                <input type="password" id="pw2">
                <div class="pw2_input_img">
                    <img src="../img/lock_clock.svg">
                </div>
            </div>
        </div>
        <div class="name">
            <div class="name_desc">이름</div>
            <div class="name_input">
                <input type="text" id="name">
            </div>
        </div>
        <div class="birth">
            <div class="birth_desc">생년월일</div>
            <div class="birth_input">
                <input type="number" id="birth_year" maxlength="4" placeholder="년(4자)">
                <select id="birth_month">
                    <option selected>월</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                </select>
                <input type="number" id="birth_date" maxlength="2" placeholder="일">
            </div>
        </div>
        <div class="sex">
            <div class="sex_desc">성별</div>
            <div class="sex_input">
                <select id="sex_sel">
                    <option>남자</option>
                    <option>여자</option>
                </select>
            </div>
        </div>
        <div class="mobile">
            <div class="mobile_desc">휴대전화</div>
            <div class="mobile_input">
                <input type="text" id="mobile">
            </div>
        </div>
        <div class="join_member">
            가입하기
        </div>
    </div>
</body>
</html>
