<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        const todos = [
            {id: 1, text: '자바스크립트 입문', done: true},
            {id: 2, text: '함수 배우기', done: true},
            {id: 3, text: '객체와 배열 배우기', done: true},
            {id: 4, text: '배열 내장함수 배우기', done: false},
        ];
        const index = todos.findIndex(todo => todo.text.match("배"));
        console.log(index);

        const index2 = todos.findIndex(doto => doto.done);
        console.log(index2);

        const index3 = todos.find(doto => doto.done);
        console.log(index3);

        const index4 = todos.filter(todo => todo.text.match("배"));
        console.log(index4);
        console.log(typeof(index4).);
    </script>
</head>

</body>
</html>
