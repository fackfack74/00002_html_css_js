<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* viewport(body)를 제외한 모든것은 position:static 으로 기본설정 */
        /* position: relative는 자신을 기준으로 이동 */
        /* position: absolute는 position: relative로 선언된 상위를 기준으로 이동 */
        /* position: fixed는 무조건 viewport(body)를 기준으로 이동 */
        html body{
            margin: 100px;
            padding: 0;
        }

        .wrapper{
            width: 450px;
            height: 350px;
            background-color: violet;
            /*
            position: relative;*/
        }
        .wrapper .container{
            width: 300px;

            background-color: royalblue;
            position: relative;
        }
        .wrapper .container .item{
            border: 3px dashed red;
        }
        .wrapper .container .item:nth-child(1){
            width: 100px;
            height: 100px;
            background-color: rgb(255, 189, 22);

            position: static;
            z-index: 999;
        }
         .wrapper .container .item:nth-child(2){
            width: 140px;
            height: 70px;
            background-color: orange;

            /* relative는 자신을 기준으로 이동 */
            /*
            position: relative;
            
            top: 30px;
            left: 30px;
            bottom: 30px;
            right: 30px;*/

            /* absolute는 부모요소(position: relative로 선언된)를 기준으로 이동 */
            /* 상위에 position: relative로 선언된게 없다면 viewport(body)를 기준으로 이동 */
            
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 1;
        }
        .wrapper .container .item:nth-child(3){
            width: 70px;
            height: 120px;
            background-color: brown;

            position: absolute;
            bottom: -30px;
            left: 50px;
            z-index: 2;
        }
 
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
        </div>
    </div>
</body>
</html>
